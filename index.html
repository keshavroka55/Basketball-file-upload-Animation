<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Basketball Upload Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <section class="card" id="card">

      <header class="head">
        <div>
          <h1>Upload files</h1>
          <p class="sub">Drag and drop, or take the shot.</p>
        </div>
        <div class="tools">
          <button class="icon-btn" id="soundBtn" type="button" aria-label="Toggle sound" aria-pressed="true">
            <svg id="soundOn" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
            <svg id="soundOff" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
          </button>
          <div class="pill" id="pill">Uploaded <b id="count">2</b></div>
        </div>
      </header>

      <!-- Drop zone (also accepts real files from your computer) -->
      <div class="dropzone" id="dropzone">
        <div class="placeholder" id="placeholder">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="m7 9 5-5 5 5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>
          <strong>Drop files here</strong>
          <span>or take the shot</span>
        </div>
        <div class="list" id="list"></div>
      </div>

      <!-- Basketball hoop -->
      <div class="hoop" id="hoop" aria-hidden="true">
        <div class="backboard"><i></i></div>
        <svg class="rim-back" width="98" height="130" viewBox="0 0 98 130">
          <rect x="43" y="49" width="12" height="7" rx="2" fill="#4f46c8"/>
          <path d="M11 62 A38 7 0 0 1 87 62" fill="none" stroke="#4f46c8" stroke-width="4.5" stroke-linecap="round"/>
        </svg>
        <svg class="rim-front" width="98" height="130" viewBox="0 0 98 130">
          <g class="net" id="net" stroke="#98a1bd" stroke-width="1" fill="none" stroke-linecap="round"></g>
          <path d="M11 62 A38 7 0 0 0 87 62" fill="none" stroke="#4f46c8" stroke-width="4.5" stroke-linecap="round"/>
        </svg>
        <span class="rim-anchor" id="rimAnchor"></span>
      </div>

      <!-- Trajectory preview dots -->
      <div class="dots" id="dots"></div>

      <!-- The draggable file (the "basketball") -->
      <div class="file" id="file" role="button" tabindex="0" aria-label="Choose a file, then drag back and release to throw it">
        <svg width="40" height="52" viewBox="0 0 40 52" fill="none">
          <path d="M4 3h22l10 10v33a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z" fill="#fff" stroke="#e3e5ee"/>
          <path d="M26 3v7a3 3 0 0 0 3 3h7" fill="#d5d8e3"/>
          <rect x="8" y="13" width="14" height="2" rx="1" fill="#d9dce8"/>
          <rect x="8" y="19" width="20" height="2" rx="1" fill="#e6e8f0"/>
          <rect x="8" y="25" width="17" height="2" rx="1" fill="#e6e8f0"/>
          <rect x="9" y="35" width="22" height="9" rx="2" fill="#2f54d6"/>
          <text id="fileExt" x="20" y="42.2" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="6.5" font-weight="700" fill="#fff">PDF</text>
        </svg>
        <span class="file-name" id="fileName">Click to choose a file</span>
      </div>

      <p class="hint" id="hint">Click the file to choose one from your device</p>
      <input type="file" id="picker" hidden />
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
